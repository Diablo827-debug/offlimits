name: Wgrywanie na Cloudflare Pages

on:
  push:
    branches: [main, test]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Zbuduj aplikację Android (telefon + Android TV)
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -q
          cp app/build/outputs/apk/release/app-release.apk ../dist/offlimits.apk
          ls -la ../dist/offlimits.apk
      - uses: actions/upload-artifact@v4
        with:
          name: offlimits-apk
          path: dist/offlimits.apk
          retention-days: 30
      - name: Zapisz APK na gałęzi apk
        run: |
          mkdir /tmp/apkrepo && cp dist/offlimits.apk /tmp/apkrepo/ && cd /tmp/apkrepo
          git init -q -b apk && git add offlimits.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -qm "APK z ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" apk
      - name: Utwórz projekt Pages (pierwszy raz)
        run: npx wrangler pages project create offlimits --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Wgraj
        run: npx wrangler pages deploy dist --project-name=offlimits --branch=${{ github.ref_name }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
