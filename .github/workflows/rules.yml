name: Wgrywanie reguł Firebase

on:
  push:
    branches: [main, test]
    paths: [database.rules.json, firebase.json, .github/workflows/rules.yml]
  workflow_dispatch:

jobs:
  rules:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FB_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - name: Brak sekretu FIREBASE_SERVICE_ACCOUNT
        if: env.FB_SA == ''
        run: echo "Brak sekretu FIREBASE_SERVICE_ACCOUNT – reguły wgrywa Claude przez konsolę Firebase."
      - name: Wgraj reguły bazy
        if: env.FB_SA != ''
        run: |
          printf '%s' "$FB_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13 deploy --only database --project offlimitsapp --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
